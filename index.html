<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study AI 9.0</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.03);
      --text: #ffffff;
      --accent-blue: #00f2fe;
      --accent-purple: #e100ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }

    /* Header & Brand Logo */
    header {
      background: rgba(11, 15, 25, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .icon-container {
      position: relative;
      width: 36px;
      height: 32px;
      display: flex;
      justify-content: space-between;
    }

    .book-page {
      width: 15px;
      height: 100%;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      border-radius: 3px 8px 8px 3px;
    }

    .book-page.right {
      background: linear-gradient(135deg, #7f00ff, #e100ff);
      border-radius: 8px 3px 3px 8px;
    }

    .ai-node {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 6px; height: 6px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00f2fe;
    }

    .main-title { font-size: 18px; font-weight: 800; color: #fff; line-height: 1; }
    .ai-highlight {
      background: linear-gradient(90deg, #00f2fe, #e100ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub-title { font-size: 8px; color: #a0aec0; letter-spacing: 1.5px; margin-top: 3px; }

    .header-btns { display: flex; gap: 8px; }
    .btn-icon {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
    }

    /* Chat Section */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message { display: flex; gap: 10px; max-width: 85%; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.ai { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00f2fe, #7f00ff);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    .msg-bubble {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
    }
    .message.user .msg-bubble { background: #1e293b; border-color: #334155; }

    /* Input Footer */
    .input-area {
      padding: 12px 16px;
      background: rgba(11, 15, 25, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      resize: none;
      height: 44px;
      outline: none;
    }

    .btn-send {
      background: linear-gradient(135deg, #00f2fe, #7f00ff);
      border: none;
      color: #fff;
      width: 44px; height: 44px;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <!-- Custom AI-Book Logo -->
    <div class="brand-logo">
      <div class="icon-container">
        <div class="book-page"></div>
        <div class="ai-node"></div>
        <div class="book-page right"></div>
      </div>
      <div>
        <div class="main-title">Study <span class="ai-highlight">AI 9.0</span></div>
        <div class="sub-title">BY AYUSHMAN</div>
      </div>
    </div>

    <div class="header-btns">
      <button class="btn-icon" onclick="openKeyModal()"><i class="fa-solid fa-key"></i></button>
    </div>
  </header>

  <div class="chat-container" id="chatContainer">
    <div class="message ai">
      <div class="avatar"><i class="fa-solid fa-robot"></i></div>
      <div class="msg-bubble">
        नमस्ते बालक! मैं आपका <b>Study AI 9.0</b> ट्यूटर हूँ (Created by Ayushman)। पढ़ाई से जुड़ा कोई भी सवाल पूछें!
      </div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="userInput" placeholder="अपनी पढ़ाई का सवाल पूछें..."></textarea>
    <button class="btn-send" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
  </div>

  <script>
    function openKeyModal() {
      let key = prompt("अपनी Gemini API Key दर्ज करें:");
      if (key) {
        localStorage.setItem("GEMINI_API_KEY", key);
        alert("API Key सफलतापूर्वक सेव हो गई!");
      }
    }

    async function sendMessage() {
      let input = document.getElementById("userInput");
      let text = input.value.trim();
      if (!text) return;

      let chat = document.getElementById("chatContainer");
      
      // User Message
      chat.innerHTML += `<div class="message user"><div class="msg-bubble">${text}</div></div>`;
      input.value = "";
      chat.scrollTop = chat.scrollHeight;

      let apiKey = localStorage.getItem("GEMINI_API_KEY");
      if (!apiKey) {
        chat.innerHTML += `<div class="message ai"><div class="avatar"><i class="fa-solid fa-robot"></i></div><div class="msg-bubble">कृपया ऊपर Key वाले बटन पर क्लिक करके अपनी Gemini API Key सेट करें!</div></div>`;
        return;
      }

      // AI Response Call
      try {
        let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: text }] }]
          })
        });
        let data = await res.json();
        let reply = data.candidates[0].content.parts[0].text;
        
        chat.innerHTML += `<div class="message ai"><div class="avatar"><i class="fa-solid fa-robot"></i></div><div class="msg-bubble">${marked.parse(reply)}</div></div>`;
        chat.scrollTop = chat.scrollHeight;
      } catch (err) {
        chat.innerHTML += `<div class="message ai"><div class="avatar"><i class="fa-solid fa-robot"></i></div><div class="msg-bubble">त्रुटि: उत्तर प्राप्त करने में समस्या आई। अपनी API Key जाँचें।</div></div>`;
      }
    }
  </script>

</body>
</html>
